name: collect-snapshot

# One option-chain snapshot per trading day, after the 16:15 ET options close.
# 22:15 UTC is 18:15 EDT / 17:15 EST. Holidays are skipped inside the job
# (no snapshot is written if ^SPX has no bar for today). The new snapshot is
# processed (results for earlier days are cached in data/derived), committed,
# and the site is redeployed.
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Collect snapshot
        run: volsurface collect
      - name: Process new snapshots
        run: volsurface process
      - name: Commit snapshot and derived results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
          git push
  site:
    needs: collect
    uses: ./.github/workflows/pages.yml
